name: Profile contribution art

on:
  schedule:
    - cron: '19 2 * * *'
  workflow_dispatch:

# Allows publishing generated SVGs to the `output` branch.
permissions:
  contents: write

concurrency:
  group: profile-art-output
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Generate circuit-board contribution animation
        uses: Sur1ive/contribution-fx@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-fx.svg?theme=circuit&palette=purple&mode=light
            dist/contribution-fx-dark.svg?theme=circuit&palette=purple&mode=dark

      - name: Generate classic light/dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230891b2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2367e8f9

      - name: Publish artwork to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
