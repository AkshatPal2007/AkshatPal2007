  <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
</defs>
<style>
  @keyframes pulse { 0%,100% {opacity:.55} 50% {opacity:1} }
  @keyframes pathflow { to {stroke-dashoffset:-84} }
  @keyframes hover { 0%,100% {transform:translateY(0px)} 50%{transform:translateY(-6px)} }
  @keyframes traceFade { 0%,100% {opacity:.35} 50% {opacity:.86} }
  .pulse {animation:pulse 3.7s ease-in-out infinite}
  .flow {animation:pathflow 15s linear infinite}
  .float {animation:hover 5.2s ease-in-out infinite}
  .trace-pulse {animation:traceFade 4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){ .pulse,.flow,.float,.trace-pulse {animation:none !important} }
</style>
